# /etc/nginx/sites-available/crapplet  (install.sh fills in __DOMAIN__ and __ROOT__)
# Legacy WHMCS links from the existing website are redirected to the new client area.
map $arg_rp $crapplet_legacy_rp {
  default                                   /client;
  "/login"                                  /client/login;
  "/register"                               /client/register;
  "/password/reset"                         /client/forgot-password;
  "~^/store/[^/]+/(?<p>[a-z0-9-]+)/?$"      /order/configure?product=$p;
  "~^/store/(?<g>[a-z0-9-]+)/?$"            /order?group=$g;
}

limit_req_zone $binary_remote_addr zone=crapplet_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=crapplet_sensitive:10m rate=20r/m;

upstream crapplet_api { server 127.0.0.1:4000; keepalive 32; }
upstream crapplet_web { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__;

  root __ROOT__/public-site;
  index index.html;
  client_max_body_size 25m;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ── VPS browser console (websocket relay to Virtualizor) ──
  location = /api/console/ws {
    proxy_pass http://crapplet_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # ── API (Express) ──
  location /api/ {
    proxy_pass http://crapplet_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  # sign-in and account recovery: slowed down per IP before they reach the app (which also limits per account)
  location ~ ^/api/auth/(login|login/2fa|forgot-password|reset-password|register|resend-verification)$ {
    limit_req zone=crapplet_auth burst=10 nodelay;
    proxy_pass http://crapplet_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/auth/reauth {
    limit_req zone=crapplet_sensitive burst=10 nodelay;
    proxy_pass http://crapplet_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Client area, order flow and admin (Next.js) ──
  # Next.js features the panel doesn't use, closed at the door (image optimiser, Server Actions)
  location ^~ /_next/image { return 404; }
  location ~ ^/(client|admin|order|_next)(/|$) {
    if ($http_next_action) { return 403; }
    client_max_body_size 1m;
    proxy_pass http://crapplet_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Old WHMCS URLs used by the website ──
  location = /clientarea/index.php { return 301 $crapplet_legacy_rp; }
  # cart.php?a=add&pid=2[&billingcycle=annually&sld=x&tld=.com] → that plan (hosting asks for the domain first)
  # cart.php?gid=3 → that plan group; cart.php?a=add&domain=register|transfer[&query=x.com] → domain search
  location = /clientarea/cart.php {
    if ($arg_pid) { return 301 /order/configure?$args; }
    if ($arg_gid) { return 301 /order?$args; }
    if ($arg_domain) { return 301 /order/domain?$args; }
    return 301 /order;
  }
  location = /cart.php {
    if ($arg_pid) { return 301 /order/configure?$args; }
    if ($arg_gid) { return 301 /order?$args; }
    if ($arg_domain) { return 301 /order/domain?$args; }
    return 301 /order;
  }
  location /clientarea/ { return 301 /client; }

  # ── Public website (static, unchanged) ──
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(ini|zip|sql|rdb|dump|log|bak|old|orig|swp|env|sh|py|php|conf|cnf|ya?ml|toml|lock|tar|t?gz|bz2|7z|rar|db|sqlite3?)$ { deny all; }
  location / { try_files $uri $uri.html $uri/ =404; }
  location ~* \.(png|jpe?g|gif|webp|svg|mp4|css|js|woff2?)$ {
    expires 7d;
    # (an add_header here replaces the server's — repeat the security headers)
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }
}
