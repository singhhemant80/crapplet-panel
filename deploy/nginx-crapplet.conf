# /etc/nginx/sites-available/crapplet  (install.sh fills in __DOMAIN__ and __ROOT__)
# Legacy WHMCS links from the existing website are redirected to the new client area.
map $arg_rp $crapplet_legacy_rp {
  default                                   /client;
  "/login"                                  /client/login;
  "/register"                               /client/register;
  "/password/reset"                         /client/forgot-password;
  "~^/store/[^/]+/(?<p>[a-z0-9-]+)/?$"      /order/configure?product=$p;
  "~^/store/(?<g>[a-z0-9-]+)/?$"            /order?group=$g;
}

limit_req_zone $binary_remote_addr zone=crapplet_auth:10m rate=10r/m;

upstream crapplet_api { server 127.0.0.1:4000; keepalive 32; }
upstream crapplet_web { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__;

  root __ROOT__/public-site;
  index index.html;
  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ── API (Express) ──
  location /api/ {
    proxy_pass http://crapplet_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location = /api/auth/login { limit_req zone=crapplet_auth burst=10 nodelay; proxy_pass http://crapplet_api; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }

  # ── Client area, order flow and admin (Next.js) ──
  location ~ ^/(client|admin|order|_next)(/|$) {
    proxy_pass http://crapplet_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Old WHMCS URLs used by the website ──
  location = /clientarea/index.php { return 301 $crapplet_legacy_rp; }
  location = /clientarea/cart.php {
    if ($arg_domain = "register") { return 301 /order/domain; }
    if ($arg_pid) { return 301 /order/configure?pid=$arg_pid; }
    return 301 /order;
  }
  location /clientarea/ { return 301 /client; }

  # ── Public website (static, unchanged) ──
  location ~ /\.(?!well-known) { deny all; }
  location ~ \.(ini|zip|sql)$ { deny all; }
  location / { try_files $uri $uri.html $uri/ =404; }
  location ~* \.(png|jpe?g|gif|webp|svg|mp4|css|js|woff2?)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
}
